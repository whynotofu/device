[workspace]
members = ["device", "device-common", "device-cli", "device-service"]
resolver = "3"

[workspace.package]
version = "0.4.0"
authors = ["Steven <278405169+whynotofu@users.noreply.github.com>"]
edition = "2024"

[workspace.dependencies]
device-common = { path = "device-common" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
